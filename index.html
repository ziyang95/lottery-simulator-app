<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="彩票模拟器">
<link rel="manifest" href="manifest.json">
<title>彩票模拟器</title>
<style>
:root{--red:#c62828;--blue:#1769aa;--bg:#f5f6fa;--card:#fff;--text:#20232a;--muted:#6b7280}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-x:none;touch-action:pan-y}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input,select{font:inherit}
header{background:linear-gradient(135deg,#b91c1c,#e34848);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 24px;border-radius:0 0 24px 24px}
header h1{font-size:25px;margin:0 0 7px}header p{margin:0;opacity:.9;font-size:13px}
main{max-width:620px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 4px 18px #1720330c}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-size:17px;margin:0 0 14px}.muted{color:var(--muted);font-size:13px}
.ball-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.ball{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:750;font-size:16px;box-shadow:inset 0 -3px 0 #00000016}
.red{background:linear-gradient(145deg,#f45b5b,#ba1010)}.blue{background:linear-gradient(145deg,#49a4f4,#1357a5)}
.actions{display:flex;gap:10px}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:650;cursor:pointer;touch-action:manipulation}.primary{background:var(--red);color:#fff;flex:1}.secondary{background:#fce8e8;color:#a71919}
.count{width:82px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;background:white;color:var(--text)}
.history-item{padding:12px 0;border-bottom:1px solid #f0f1f4}.history-item:last-child{border-bottom:0}.history-item .ball{width:30px;height:30px;font-size:12px}.history-item .ball-row{justify-content:flex-start;margin:8px 0 0;gap:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8f8fb;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:20px;margin-bottom:3px}.empty{text-align:center;padding:22px 8px;color:var(--muted);font-size:14px}
.notice{font-size:12px;line-height:1.6;color:var(--muted);padding:4px 2px 14px}
footer{text-align:center;color:#9ca3af;font-size:11px;padding:4px}
@media(max-width:360px){.ball{width:36px;height:36px;font-size:14px}.ball-row{gap:6px}.card{padding:14px}}
</style>
</head>
<body>
<header><h1>🎱 彩票模拟器</h1><p>随机号码 · 模拟记录 · 纯娱乐用途</p></header>
<main>
<section class="card">
 <div class="row"><h2>模拟选号</h2><span class="muted">红球 5 个 · 蓝球 2 个</span></div>
 <div class="ball-row" id="current" aria-label="当前号码"></div>
 <div class="actions"><button class="btn primary" id="generate">随机生成一注</button><button class="btn secondary" id="generate5">生成 5 注</button></div>
 <div class="muted" style="margin-top:12px">号码范围：红球 1–35，蓝球 1–12（依据所提供程序的随机规则）</div>
</section>
<section class="card">
 <div class="row"><h2>模拟统计</h2><button class="btn secondary" id="clear" style="padding:8px 11px;font-size:13px">清空记录</button></div>
 <div class="stats"><div class="stat"><strong id="total">0</strong><span class="muted">生成注数</span></div><div class="stat"><strong id="redTotal">0</strong><span class="muted">红球总数</span></div><div class="stat"><strong id="blueTotal">0</strong><span class="muted">蓝球总数</span></div></div>
</section>
<section class="card"><div class="row"><h2 style="margin:0">历史模拟记录</h2><span class="muted">仅保存在本机</span></div><div id="history"><div class="empty">还没有记录，生成号码后会显示在这里。</div></div></section>
<div class="notice">本工具仅用于随机号码模拟和娱乐，不提供中奖预测或中奖保证。随机结果不代表真实开奖，也不连接任何彩票销售或投注服务。</div>
<footer>彩票模拟器 · 离线可用</footer>
</main>
<script>
(function(){
 const $=id=>document.getElementById(id);
 const pick=(max,count)=>{const s=new Set();while(s.size<count)s.add(Math.floor(Math.random()*max)+1);return [...s].sort((a,b)=>a-b)};
 let history=[];
 try{history=JSON.parse(localStorage.getItem('lottery-sim-history')||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}
 const ball=(n,color)=>`<span class="ball ${color}">${String(n).padStart(2,'0')}</span>`;
 function renderCurrent(item){$('current').innerHTML=item?item.red.map(n=>ball(n,'red')).join('')+item.blue.map(n=>ball(n,'blue')).join(''):''}
 function renderHistory(){
  $('total').textContent=history.length;
  $('redTotal').textContent=history.length*5;
  $('blueTotal').textContent=history.length*2;
  $('history').innerHTML=history.length?history.slice().reverse().map((x,i)=>`<div class="history-item"><div class="row"><strong>第 ${history.length-i} 注</strong><span class="muted">${escapeText(x.time)}</span></div><div class="ball-row">${x.red.map(n=>ball(n,'red')).join('')}${x.blue.map(n=>ball(n,'blue')).join('')}</div></div>`).join(''):'<div class="empty">还没有记录，生成号码后会显示在这里。</div>';
 }
 function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function generate(){const item={red:pick(35,5),blue:pick(12,2),time:new Date().toLocaleString()};history.push(item);if(history.length>200)history=history.slice(-200);try{localStorage.setItem('lottery-sim-history',JSON.stringify(history))}catch(e){}renderCurrent(item);renderHistory()}
 $('generate').addEventListener('click',generate);
 $('generate5').addEventListener('click',()=>{for(let i=0;i<5;i++)generate()});
 $('clear').addEventListener('click',()=>{if(confirm('确定清空所有模拟记录吗？')){history=[];try{localStorage.removeItem('lottery-sim-history')}catch(e){}renderCurrent(null);renderHistory()}});
 renderHistory(); if(history.length)renderCurrent(history[history.length-1]);else generatePreview();
 function generatePreview(){renderCurrent({red:pick(35,5),blue:pick(12,2)})}
 // Reduce iOS long-press selection/context menus and clipboard actions.
 ['contextmenu','copy','cut','paste','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),true));
 document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','v','a'].includes(k))e.preventDefault();if(e.shiftKey&&k==='insert')e.preventDefault()},true);
 // Register service worker and check for updates on visits/focus.
 if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
  const check=()=>navigator.serviceWorker.register('./sw.js').then(reg=>reg.update()).catch(()=>{});
  check();window.addEventListener('pageshow',check);window.addEventListener('focus',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
 }
})();
</script>
</body></html>
